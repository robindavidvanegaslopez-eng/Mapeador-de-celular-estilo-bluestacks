name: Descomprimir y compilar

on:
  push:
    paths:
      - 'MapeadorToques.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el ZIP en el repositorio
        run: |
          unzip -o MapeadorToques.zip -x ".github/*" "__MACOSX/*"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Descomprimir MapeadorToques.zip"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar (assembleDebug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MapeadorToques-debug
          path: app/build/outputs/apk/debug/*.apk
